# language: php

jobs:
  include:
    - dist: noble
      env:
        - RELEASE=noble
      name: noble
      #php: "8.3"
      before_install:
        - sudo rm -rf /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock
        - sudo apt-get update
        - sudo apt-get -y install libcurl4-openssl-dev php-dev libicu-dev php-pear php build-essential libpq-dev libxml2-dev libssl-dev libcurl4-openssl-dev libjpeg-dev libpng-dev libfreetype6-dev libonig-dev libzip-dev libbz2-dev libreadline-dev libxslt1-dev pkg-config
        - if [[ $VERSION =~ ^8.* ]]; then sudo apt-get -y install argon2 php-pear php-dev libonig-dev; fi
        - sudo ln -s /usr/include/x86_64-linux-gnu/curl/ /usr/local/include
        - command -v expect || sudo apt-get install expect
        - |
          if ! command -v phpenv; then
            pushd $HOME
            curl -L https://raw.githubusercontent.com/phpenv/phpenv-installer/master/bin/phpenv-installer | bash
            popd
            export PHPENV_ROOT="/home/travis/.phpenv"
            if [ -d "${PHPENV_ROOT}" ]; then
              export PATH="${PHPENV_ROOT}/bin:${PATH}"
              eval "$(phpenv init -)"
            fi
          fi
      script:
        # Add debug echo to help understand the environment
        - echo "Current working directory: $(pwd)"
        - echo "PHP version to build: $VERSION"
        - echo "Looking for definition files..."
        - find $HOME/.php-build -name "$VERSION" -type f || true
        - find . -name "$VERSION" -type f || true
        
        # Copy the definition file if it exists in the repository
        - |
          if [[ -f php-src-builder/php-build/definitions/$VERSION ]]; then
            echo "Found definition file in repository, copying to php-build directory..."
            mkdir -p $HOME/.php-build/share/php-build/definitions/
            cp -v php-src-builder/php-build/definitions/$VERSION $HOME/.php-build/share/php-build/definitions/
            cat $HOME/.php-build/share/php-build/definitions/$VERSION
          fi
        
        - echo "--enable-option-checking=fatal" >> $HOME/.php-build/share/php-build/default_configure_options
        - cat $HOME/.php-build/share/php-build/default_configure_options
        - export PKG_CONFIG_PATH="$HOME/.phpenv/versions/$VERSION/lib/pkgconfig:$PKG_CONFIG_PATH"
        
        # Build with explicit path if definition exists in repository
        - |
          if [[ -f php-src-builder/php-build/definitions/$VERSION ]]; then
            echo "Building with explicit definition path..."
            php-build -i development php-src-builder/php-build/definitions/$VERSION $HOME/.phpenv/versions/$VERSION
          else
            echo "Building with standard path..."
            ./bin/compile
          fi
